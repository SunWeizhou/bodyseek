<main class="workspace"><aside class="intro"><div class="eyebrow">BODYSEEK / DESIGN STUDY 01</div><h1>把身体的变化，<br>看得更清楚。</h1><p>A 已按你的偏好更新：系统字体，更大的数字，更少的小字。四个页面采用同一套间距、圆角与色彩。B / C 留作方向对照。</p><span class="badge">可交互设计原型 · 全部为示例数据</span><div id="options"></div><div class="controls"><label for="state">数据状态</label><select id="state"><option value="full">数据充足</option><option value="partial">部分缺失</option><option value="empty">暂无数据</option><option value="stale">数据陈旧</option><option value="failed">同步失败</option></select></div><p class="note">用于确定整体方向。原型不连接 HealthKit、不发送 AI 请求、不保存操作，不代表评分结果已验证。</p><div class="fullstate" id="state-display"></div></aside><section class="phone" id="phone" aria-label="BodySeek 手机界面原型"><div class="camera"></div><div class="status"><span>9:41</span><span>●●●  ▰</span></div><header class="app-header"><div class="brand"><i class="orbit"></i>BodySeek</div><button class="avatar" aria-label="示例设置" onclick="showDetails('设置')">W</button></header><div class="content" id="content"></div><nav class="nav" id="nav"></nav><div class="homebar"></div></section></main><div class="switcher"><button id="prev" aria-label="上个视觉方案">←</button><span id="variant-name"></span><button id="next" aria-label="下个视觉方案">→</button></div>
<script>
const variants={A:{name:'安静仪表 · 修订版',desc:'紧凑五分、清晰层次、克制的颜色。推荐作为每天使用的默认方向。'},B:{name:'身体日报',desc:'有留白的日记式阅读，让数据、变化和个人记录成为一页连续内容。'},C:{name:'深夜观测',desc:'暗色仪表与时间线，适合关注当天节律、训练前后变化。'}};
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!variants[variant])variant='A';let page='today',dataState='full',completed=new Set(),feeling='',answer=false;
const icons={today:'<path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/><circle cx="12" cy="12" r="4"/>',trends:'<path d="M3 4v17h18M6 16l4-5 4 2 6-8"/>',plan:'<path d="M9 6h12M9 12h12M9 18h12M2 5l2 2 3-4M2 12h3M2 18h3"/>',coach:'<path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 3v-3H3V6a2 2 0 0 1 2-2Z"/><path d="M7 9h10M7 13h6"/>'};
const names={today:'今天',trends:'趋势',plan:'计划',coach:'Coach'};const scores=[['恢复',72,'#71988b','接近平时'],['睡眠',81,'#928ab8','较充足'],['负荷',36,'#bf9279','当前负荷']];
const unavailable=()=>dataState==='empty';const scoreValue=i=>unavailable()||(dataState==='partial'&&i===0)?'—':scores[i][1];
function ring(i){const [name,,tone,sub]=scores[i],n=scoreValue(i);return `<button class="metric" onclick="showDetails('${name}')"><div class="ring" style="--tone:${tone};--dash:${n==='—'?0:n*2.7}"><svg viewBox="0 0 100 100"><circle class="base" cx="50" cy="50" r="43"/><circle class="value" cx="50" cy="50" r="43"/></svg><strong>${n}</strong></div><div class="metric-name">${name}</div><div class="metric-sub">${n==='—'?'数据不足':sub}</div></button>`}
function status(){return `<div class="statusline"><i class="dot"></i>${({full:'今天 09:32 更新',partial:'今天 09:32 · 恢复数据不足',empty:'等待可用的健康数据',stale:'上次可用数据 · 昨天 21:10',failed:'上次可用数据 · 今天 08:20'})[dataState]}</div>${dataState==='failed'?'<div class="notice">本次同步未完成。保留上次结果，稍后可重试。</div>':''}`}
function allScores(){return `<div class="score-group">${scores.map((_,i)=>ring(i)).join('')}</div><div class="secondary"><div><header><span>生理压力</span><b>${unavailable()?'—':'28'}</b></header><svg class="mini-chart" viewBox="0 0 140 28">${unavailable()?'<path d="M0 14H140" stroke="currentColor" stroke-dasharray="2 6" opacity=".4"/>':'<path d="M0 20L12 19L23 13L34 16L45 8L56 14L67 12L79 16L91 12L103 15L115 11L127 14L140 9" fill="none" stroke="currentColor" stroke-width="1.8"/>'}</svg><div class="small">${unavailable()?'暂无记录':'近期观察'}</div></div><div><header><span>能量</span><b>${unavailable()?'—':'67'}</b></header><div class="energy" style="--width:${unavailable()?'0':'67%'}"><i></i></div><div class="small">${unavailable()?'暂无记录':'当前可用余量'}</div></div></div>`}
function brief(){let title='恢复接近平时，按自己的节奏。',detail='昨晚睡眠较充足，近期没有新的明显偏离。今天暂不需要额外调整。';if(dataState==='partial'){title='已有睡眠信息，恢复仍待确认。';detail='HRV 信息不足，暂不判断恢复状态。你可以先查看睡眠与当前负荷。'}if(unavailable()){title='先从已有记录开始。';detail='尚未获得可用的健康数据。连接后逐项显示；没有读到数据不代表身体状态差。'}if(dataState==='stale'){title='这里是昨天的状态。';detail='今天的身体变化尚待新记录。上次结果仅供回看，不用于判断此刻。'}return `<section class="brief"><div class="brief-label">${variant==='B'?'今日一则':'今日解读'}</div><h3>${title}</h3><p${dataState!=='full'?' style="display:block;font-size:15px"':''}>${detail}</p><button class="inline-link" onclick="showDetails('今日解读')">查看依据 ↗</button></section>`}
function today(){const intro=variant==='B'?'<div class="paper-date">Tuesday, September 22</div><h2>身体日报</h2>':variant==='C'?'<div class="linehead"><h2>今日观测</h2><span class="small">09.22 · 周二</span></div><div class="timeline"><b>清晨</b><span>午后</span><span>训练后</span><span>夜间</span></div>':'<div class="linehead"><h2>今天</h2><span class="small">9月22日 · 周二</span></div>';return `<div class="prototype-tag">示例状态 · 设计预览</div>${intro}${status()}${allScores()}${brief()}<div class="feel"><span>${feeling?'已记录：'+feeling:'和你的感觉一致吗？'}</span><div><button onclick="setFeeling('符合感受')">符合</button><button onclick="setFeeling('感觉不同')">不太一样</button></div></div><div class="next"><header><span>${completed.size===3?'今日安排':'下一项'}</span><button class="inline-link" style="padding:0" onclick="go('plan')">查看计划 →</button></header><strong>${completed.size===3?'今天已安排好':!completed.has(0)?'按原计划活动':!completed.has(1)?'午后留一段散步时间':'给睡眠留足时间'}</strong><p>${completed.size===3?'保持自己的节奏，无需再加任务。':'你可以修改安排，也可以选择休息。'}</p></div>`}
function trends(){return `<div class="prototype-tag">示例状态 · 设计预览</div><h2>${variant==='B'?'变化的线索':'趋势'}</h2><div class="small">把今天放进更长的时间里</div><div class="horizon"><span>7 天</span><span class="selected">30 天</span><span>6 个月</span><span>3 年</span></div><section class="brief"><div class="brief-label">${unavailable()?'等待观察':'本月主要变化'}</div><h3>${unavailable()?'还没有足够的趋势数据。':'睡眠时间正在变得规律。'}</h3><p>${unavailable()?'有足够记录后，再比较不同时间窗口。':'最近两周与此前两周相比，入睡时间的波动更小。先观察是否伴随更好的白天感受。'}</p></section><div class="linehead"><strong style="font-size:13px">睡眠</strong><span class="small">${unavailable()?'0':'24'}/30 天有记录</span></div><svg class="chart" viewBox="0 0 340 150"><path d="M0 40H340M0 80H340M0 120H340" stroke="var(--line)"/><rect x="0" y="49" width="340" height="42" fill="#928ab8" opacity=".08"/>${unavailable()?'': '<path d="M5 90L20 100L35 79L50 90L65 60L80 81L95 74L110 90L125 70 M150 77L165 62L180 69L195 53L210 67L225 47L240 58L255 49L270 60L285 43L300 50L320 36L338 41" stroke="#928ab8" stroke-width="2.2" fill="none"/>'}<text x="0" y="145">8月24日</text><text x="287" y="145">9月22日</text></svg><div class="stat-row"><div><span class="small">平均睡眠分</span><b>${unavailable()?'—':'78'}</b></div><div><span class="small">平均时长</span><b>${unavailable()?'—':'7h 24m'}</b></div><div><span class="small">记录覆盖</span><b>${unavailable()?'—':'24 天'}</b></div></div><button class="question" onclick="showDetails('五项趋势')">查看全部五项状态<span>↗</span></button><section class="review"><div class="brief-label">一周回顾</div><h3>最近有什么值得保留？</h3><p>把行动和随后的身体变化放在一起看。相关的变化，也可能有其他解释。</p><button class="inline-link" onclick="go('coach')">一起梳理 →</button></section>`}
function plan(){const items=[['按原计划活动','量力而行，安排始终由你决定。'],['午后留一段散步时间','给久坐的工作日一次短暂间隔。'],['给睡眠留足时间','尽量接近平常的入睡时间。']];return `<div class="prototype-tag">示例状态 · 设计预览</div><h2>你的安排</h2><div class="small">9月22日 · ${completed.size}/3 已完成</div><div class="context">本地可用 · 修改和完成后同步到 Today</div>${items.map(([title,detail],i)=>`<div class="plan-item ${completed.has(i)?'done':''}"><button class="check" aria-label="${completed.has(i)?'取消完成':'完成'}${title}" onclick="togglePlan(${i})">${completed.has(i)?'✓':''}</button><div><strong>${title}</strong><p>${detail}</p></div></div>`).join('')}<section class="brief"><div class="brief-label">${completed.size===3?'今天已安排好':'保留选择'}</div><h3>${completed.size===3?'做完之后，就好好生活。':'计划可以随你调整。'}</h3><p>${completed.size===3?'不会因为全部完成，再为你增加新任务。':'身体感受与分数不同、日程有变化，都可以调整。'}</p></section><button class="question" onclick="showDetails('调整计划')">调整今天的安排<span>↗</span></button><button class="inline-link" onclick="go('today')">返回 Today 看下一项 →</button>`}
function coach(){return `<div class="prototype-tag">示例状态 · 设计预览</div><h2>${variant==='B'?'和身体对话':'今天想聊什么？'}</h2><div class="context">9月22日 · ${unavailable()?'当前数据不足':'恢复 72 · 睡眠 81 · 负荷 36'}</div>${answer?'<div class="reply"><b>先看变化，再判断要不要调整。</b><p>示例中睡眠较充足，恢复接近平时。不过分数不能替代你的感受；如果今天更疲惫，这条信息也应进入判断。</p><span class="small">依据：9月22日示例快照 · 本地演示，未调用 AI</span></div>':'<section class="brief"><h3>今天想理解什么？</h3><p>你不必从一段长提示词开始。</p></section>'}<button class="question" onclick="ask()">我感觉很累，为什么分数还好？<span>↗</span></button><button class="question" onclick="ask()">睡眠最近的变化意味着什么？<span>↗</span></button><button class="question" onclick="ask()">昨天的训练之后，今天有什么变化？<span>↗</span></button><div class="composer">继续说说你的感受… <span style="float:right">↑</span></div>`}
function render(){document.getElementById('phone').className='phone variant'+variant;document.getElementById('options').innerHTML=Object.entries(variants).map(([k,v])=>`<button class="option ${k===variant?'selected':''}" onclick="choose('${k}')"><div class="key">${k}</div><div><b>${v.name}</b><span>${v.desc}</span></div></button>`).join('');document.getElementById('variant-name').textContent=variant+' · '+variants[variant].name;document.getElementById('content').innerHTML=({today,trends,plan,coach})[page]();document.getElementById('nav').innerHTML=Object.keys(names).map(k=>`<button class="${page===k?'active':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${icons[k]}</svg>${names[k]}</button>`).join('');document.getElementById('state-display').textContent=JSON.stringify({variant,page,dataState,completed:[...completed],feeling},null,2);}
function choose(k){variant=k;const u=new URL(location.href);u.searchParams.set('variant',k);history.replaceState(null,'',u);render()}function cycle(step){const keys=Object.keys(variants);choose(keys[(keys.indexOf(variant)+step+3)%3])}function go(k){page=k;render();document.getElementById('content').scrollTop=0}function setFeeling(s){feeling=s;render()}function togglePlan(i){completed.has(i)?completed.delete(i):completed.add(i);render()}function ask(){answer=true;render()}function showDetails(name){document.querySelector('.details')?.remove();const el=document.createElement('div');el.className='details';el.innerHTML=`<button onclick="this.parentElement.remove()">← 返回</button><h2 style="margin-top:25px">${name}</h2><div class="notice">交互示意 · 以下不是实际健康分析</div><p>详情统一显示所选日期、当前观测、个人基线、缺失项和数据来源。这里仅演示导航层次，不重新计算分数。</p><p>正式版本继续使用本地确定性事实。出现数据缺失、历史修订或保存失败时，清楚说明原因并提供恢复入口。</p><button onclick="this.parentElement.remove();go('coach')">带着当天的依据继续追问 ↗</button>`;document.getElementById('phone').append(el)}document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.getElementById('state').onchange=e=>{dataState=e.target.value;render()};document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
</script></body></html>
