:root[data-theme="dark"] {

.date-caption { font-size:.83rem; color:var(--muted); font-weight:500 }

.key { width:.85rem; height:.56rem; background:var(--domain,var(--accent)); border-radius:.2rem; display:inline-block }

.trend-controls { display:flex; flex-wrap:wrap; gap:.55rem; margin-bottom:.9rem }

.trend-chart { width:100%; height:13rem; display:block; touch-action:pan-y; cursor:crosshair; border-radius:.38rem }
.trend-hint { margin-top:.65rem }

.summary-row:last-child { border:0 }
details { border-top:1px solid var(--line); margin-top:.8rem; padding-top:.35rem }

.chat-col { display:grid; gap:.9rem; min-width:0 }

.suggest { display:flex; flex-wrap:wrap; gap:.42rem }
.composer { display:flex; gap:.42rem }

textarea { min-height:5rem; resize:vertical }
.field { display:grid; gap:.27rem; font-size:.87rem; font-weight:620; margin:.6rem 0 }

.sheet-body { padding:.92rem 1.12rem 1.18rem }

@media (max-width:44rem) {

<body>
<a class="skip" href="#main">跳到主要内容</a>
<header class="chrome">
  <div class="chrome-inner">
    <a href="#today" class="brand" aria-label="BodySeek 今日"><span class="brand-icon" data-icon="pulse"></span>BodySeek</a>
    <nav class="main-nav" aria-label="主导航"></nav>
    <div class="top-actions"><span class="demo">示例数据</span><button class="icon-button" id="theme-toggle" type="button" aria-label="切换深色模式"></button></div>
  </div>
</header>
<main class="main" id="main" tabindex="-1"></main>
<dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
  <div class="sheet-head"><h2 id="sheet-title"></h2><button class="icon-button" id="sheet-close" type="button" aria-label="关闭" data-icon="close"></button></div>
  <div class="sheet-body" id="sheet-body"></div>
</dialog>
<p role="status" id="announcement" class="toast" hidden></p>
<noscript>请启用 JavaScript 以查看 BodySeek 交互原型。</noscript>
<script>
const icons = {

    for (let i=records.length-1;i>=0;i--) ctx.lineTo(x(i),y(records[i].baseline[0]));

  period:key=>{ state.days = +key; state.selected = null; rerenderControl('period',key); },
  'trend-metric':key=>{ state.metric = key; state.selected = null; rerenderControl('trend-metric',key);
    if (matchMedia('(max-width:50.99rem)').matches) $('.trend-shell').scrollIntoView({block:'nearest'});
  },
  'clear-trend':()=>{ pickTrend(null); $('#trend-chart').focus({preventScroll:true}); },
  'open-trend':key=>{ state.metric = key; state.selected = null; sheet.close(); gotoPage('trends'); },
  plan:key=>applyPlan(key), 'undo-plan':key=>applyPlan(key,true),
  prompt:key=>addChat(scriptedPrompts[+key],+key)
};
document.addEventListener('click',event => {
  const target = event.target.closest('button[data-action]');
  if (target) actions[target.dataset.action]?.(target.dataset.detail);
});
document.addEventListener('submit',event => {
  if (event.target.id === 'coach-form') {
    event.preventDefault();
    const input = $('#coach-input');
    const value = input.value.trim();
    if (!value) { input.focus(); return; }
    const index = /周六|练腿/.test(value) ? 1 : /恢复.*降|为什么|这周/.test(value) ? 0 : /训练|今天/.test(value) ? 2 : -1;
    addChat(value,index);
  }
  if (event.target.id === 'entry-form') {
    event.preventDefault();
    const form = event.target;
    const data = new FormData(form);
    const note = data.get('note').trim();
    if (!note) {
      form.elements.note.setCustomValidity('请输入内容。');
      form.elements.note.reportValidity();
      form.elements.note.addEventListener('input',()=>form.elements.note.setCustomValidity(''),{once:true});
      return;
    }
    const kind = form.dataset.kind;
    if (kind === 'meal') {
      const kcal = data.get('kcal');
      state.meals.push({name:note.match(/^(早餐|午餐|晚餐|加餐)/)?.[1] || '新增餐次',note,kcal:kcal === '' ? null : +kcal,estimated:0,icon:'fork'});
    } else state[kind] = note;
    sheet.close();
    render();
    announce(kind === 'meal' ? '已保存餐次' : kind === 'review' ? '已保存复盘' : '已保存打卡');
  }
});
$('#theme-toggle').addEventListener('click',() => {
  skillTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  drawTheme();
});
themeMedia.addEventListener('change',()=>{ if (!skillTheme) drawTheme(); });
$('.skip').addEventListener('click',event => {
  event.preventDefault();
  main.focus();
});
window.addEventListener('hashchange',()=>route({focus:true}));
drawIcons();
drawTheme();
route();
</script>
</body>
</html>
