name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS build and tests
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - name: Select and verify Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail

          required_version="$(tr -d '[:space:]' < .xcode-version)"
          test -n "$required_version" || {
            echo "::error::.xcode-version is empty; declare the required Xcode version before running CI."
            exit 1
          }

          normalize_version() {
            echo "$1" | sed -E 's/(\.[0-9]+)\.0$/\1/'
          }

          norm_required="$(normalize_version "$required_version")"

          # GitHub-hosted macOS images install side-by-side Xcode bundles using
          # naming conventions like Xcode_26.5.0.app or Xcode_26.5.app.
          developer_dir=""
          for candidate in \
            "/Applications/Xcode_${required_version}.app/Contents/Developer" \
            "/Applications/Xcode_${norm_required}.app/Contents/Developer" \
            "/Applications/Xcode.app/Contents/Developer"
          do
            if [ -d "$candidate" ]; then
              developer_dir="$candidate"
              break
            fi
          done

          if [ -z "$developer_dir" ]; then
            echo "::error::Required Xcode ${required_version} (or ${norm_required}) is not installed on this runner."
            echo "Installed Xcode bundles:"
            find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort || true
            exit 1
          fi

          actual_raw="$(DEVELOPER_DIR="$developer_dir" xcodebuild -version | awk '$1 == "Xcode" { print $2; exit }')"
          norm_actual="$(normalize_version "$actual_raw")"

          if [ "$norm_actual" != "$norm_required" ]; then
            echo "::error::Xcode toolchain mismatch: .xcode-version requests ${required_version} (normalized ${norm_required}), resolved ${actual_raw:-unknown} (normalized ${norm_actual})."
            exit 1
          fi

          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          echo "=== Xcode Toolchain & Runtime Information ==="
          echo "Xcode: ${actual_raw} at ${developer_dir}"
          DEVELOPER_DIR="$developer_dir" xcodebuild -version
          DEVELOPER_DIR="$developer_dir" swift --version
          DEVELOPER_DIR="$developer_dir" xcodebuild -showsdks || true
          xcrun simctl list runtimes || true
          echo "============================================="

      - name: Schema version guard
        shell: bash
        run: |
          python3 scripts/schema_fingerprint.py --check

      - name: Contrast guard (textColor >= 4.5:1)
        shell: bash
        run: |
          python3 scripts/check_contrast.py

      - name: Fixed-font scan (report-only, track H1 cleanup)
        shell: bash
        run: |
          python3 scripts/check_fixed_fonts.py

      - name: SwiftLint (report-only until baseline is clean)
        shell: bash
        run: |
          set -euo pipefail
          if which swiftlint >/dev/null 2>&1; then
            swiftlint --config .swiftlint.yml || true
          else
            # macos runners 不预装 SwiftLint；安装后运行自定义规则审计
            brew install swiftlint >/dev/null 2>&1
            swiftlint --config .swiftlint.yml || true
          fi

      - name: Reject tracked dependencies
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)node_modules/' > /tmp/tracked-node-modules.txt; then
            echo "node_modules must not be tracked."
            head -n 20 /tmp/tracked-node-modules.txt
            exit 1
          fi

      - name: Build with warnings as errors
        shell: bash
        run: |
          set -o pipefail
          # SWIFT_TREAT_WARNINGS_AS_ERRORS and GCC_TREAT_WARNINGS_AS_ERRORS are codified
          # in Vela.xcodeproj on all first-party targets. Do not pass them via CLI overrides
          # to avoid conflicting with SPM package dependencies (e.g. SentryCppHelper -suppress-warnings).
          xcodebuild \
            -project Vela.xcodeproj \
            -scheme Vela \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Run iOS tests
        shell: bash
        run: |
          set -euo pipefail
          # 确定性选择：可用 iPhone 模拟器中名称排序第一个（取代 head -n 1 的非确定行为）
          device_udid="$({ xcrun simctl list devices available -j | \
            jq -r '[.devices[][] | select(.isAvailable and (.name | startswith("iPhone"))) | {name, udid}] | sort_by(.name, .udid) | .[0].udid'; } )"
          test -n "$device_udid"
          set -o pipefail
          xcodebuild test \
            -project Vela.xcodeproj \
            -scheme Vela \
            -destination "platform=iOS Simulator,id=$device_udid" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/UnitTests.xcresult \
            -enableCodeCoverage YES \
            -testLanguage zh \
            -testRegion CN \
            -only-testing:VelaTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Run iOS UI smoke tests
        shell: bash
        run: |
          set -euo pipefail
          device_udid="$({ xcrun simctl list devices available -j | \
            jq -r '[.devices[][] | select(.isAvailable and (.name | startswith("iPhone"))) | {name, udid}] | sort_by(.name, .udid) | .[0].udid'; } )"
          test -n "$device_udid"
          set -o pipefail
          xcodebuild test \
            -project Vela.xcodeproj \
            -scheme Vela \
            -destination "platform=iOS Simulator,id=$device_udid" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/UISmokeTests.xcresult \
            -testLanguage zh \
            -testRegion CN \
            -only-testing:VelaUITests

      - name: Coverage summary (report-only)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d build/UnitTests.xcresult ]; then
            xcrun xccov view --report build/UnitTests.xcresult 2>/dev/null | tail -n 15 || true
          else
            echo "No xcresult bundle found; coverage report skipped."
          fi

      - name: Upload xcresult on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: |
            build/UnitTests.xcresult
            build/UISmokeTests.xcresult
          if-no-files-found: ignore

  backend:
    name: Backend tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Run Swift package tests
        run: swift test --package-path VelaBackend
